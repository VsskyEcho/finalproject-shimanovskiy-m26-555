[project]
name = "finalproject-shimanovskiy-m26-555"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
rates_ttl_seconds = 300
default_base_currency = "USD"
users_path = "data/users.json"
portfolios_path = "data/portfolios.json"
rates_path = "data/rates.json"
exchange_rates_path = "data/exchange_rates.json"
parser_log_path = "logs/parser.log"
log_path = "logs/actions.log"
log_level = "INFO"
log_max_bytes = 1000000
log_backup_count = 4
scheduler_interval_seconds = 3600
