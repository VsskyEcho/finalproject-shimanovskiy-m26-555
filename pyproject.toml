[project]
name = "finalproject-shimanovskiy-m26-555"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]